[project]
name = "enterprise-agent-hub"
version = "0.1.0"
description = "研发团队 Agent 平台共享 Python 后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn>=0.54,<0.55",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.0.57,<2.1",
  "psycopg[binary,pool]>=3.3.8,<4",
  "alembic>=1.20,<2",
  "pgvector>=0.5,<0.6",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "mcp>=1.28,<2",
  "openai>=3.46,<4",
  "httpx>=0.28,<1",
  "redis>=7,<8",
  "celery>=5.5,<6",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.3,<3",
  "tiktoken>=0.12,<1",
  "dashscope[tokenizer]==1.26.7",
  "boto3>=1.42,<2",
  "python-multipart>=0.0.20,<0.1",
  "pypdf==7.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "httpx2>=2.16,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a disposable PostgreSQL database"]
addopts = "-ra"
